# Continuous integration: test and build everything on every push and pull request.
# It never publishes anything.

name: CI

on:
  # Every branch. Tags are not branches, so pushing a tag doesn't start this workflow.
  push:
    branches: ["**"]
  pull_request:

# The built-in GITHUB_TOKEN may only read the code
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to a full commit SHA, so a moved tag can't change
      # what runs here. The comment shows which release the SHA belongs to.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: coffeeshop-api/pom.xml

      # All tests (unit, Mockito, ArchUnit and the API tests with H2), then the jar is packaged
      - name: Run the tests
        working-directory: coffeeshop-api
        run: ./mvnw -B verify

      # Placeholder values only: Compose refuses to run without these variables,
      # but checking the files needs no real secrets.
      - name: Validate the Compose files
        env:
          DB_PASSWORD: ci-placeholder
          MYSQL_ROOT_PASSWORD: ci-placeholder
          STAFF_PASSWORD: ci-placeholder
        run: |
          docker compose -f compose.dev.yaml config --quiet
          docker compose -f compose.full.yaml config --quiet

      - name: Build the API image
        run: docker build --tag coffeeshop-api:ci ./coffeeshop-api

      - name: Build the frontend image
        run: docker build --tag coffeeshop-frontend:ci ./frontend
