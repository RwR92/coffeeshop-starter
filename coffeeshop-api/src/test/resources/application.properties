# Used by the tests instead of src/main/resources/application.properties
# (it has the same name, and the test version wins). No MySQL or Docker needed.

# H2: an in-memory database inside the test JVM. MODE=MySQL makes it behave
# more like MySQL. DB_CLOSE_DELAY=-1 keeps it alive between connections.
spring.datasource.url=jdbc:h2:mem:coffeeshop-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# The staff account for the tests (StaffAccountInitData)
coffeeshop.staff.email=staff@test.example
coffeeshop.staff.password=test-staff-password

# Fresh tables for every test run, dropped again at the end
spring.jpa.hibernate.ddl-auto=create-drop

# The same as in production, so the tests catch the same mistakes
# (e.g. a lazy collection loaded outside a transaction)
spring.jpa.open-in-view=false
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never

# Spring AI (once you add it): the tests must never call a real model. Nothing listens
# on port 9, so a test that forgets to mock fails at once instead of waiting for a model.
# Replace the model with @MockitoBean ChatModel, or test your tools as plain methods.
spring.ai.openai.base-url=http://localhost:9/v1
spring.ai.openai.api-key=test
spring.ai.openai.chat.model=test-model
