spring.application.name=coffeeshop-api

server.port=8080

# MySQL runs in Docker (compose.dev.yaml), Spring Boot runs in your IDE or with Maven
spring.datasource.url=jdbc:mysql://localhost:3306/coffeeshop
spring.datasource.username=${DB_USERNAME:coffeeshop}
spring.datasource.password=${DB_PASSWORD}

# Staff accounts can't sign up: StaffAccountInitData creates this one at startup.
# The password comes from .env (STAFF_PASSWORD), never from git.
coffeeshop.staff.email=${STAFF_EMAIL:staff@coffeeshop.dk}
coffeeshop.staff.password=${STAFF_PASSWORD}

# Read DB_USERNAME and DB_PASSWORD from the .env file in the repository root,
# so you don't have to copy them into your IDE. Works whether the working
# directory is the repository root or coffeeshop-api/.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# Hibernate creates and updates the tables from the entities.
# "update" adds new tables and columns, but never drops or renames anything:
# if you rename a field, the old column stays. Start over with "docker compose down -v".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Show the SQL Hibernate sends while developing
spring.jpa.show-sql=true

# Spring AI: the chat model, used once you add spring-ai-starter-model-openai (see pom.xml).
# Docker Model Runner speaks the OpenAI API on port 12434 and needs no key, but Spring AI
# refuses to start without one. Get the model first: docker model pull ai/qwen3
# (ai/smollm2 is smaller and faster, but it can't call tools.)
spring.ai.openai.base-url=http://localhost:12434/engines/v1
spring.ai.openai.api-key=NOT_USED
spring.ai.openai.chat.model=ai/qwen3

# Observability
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Never send stack traces or internal messages to clients
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
